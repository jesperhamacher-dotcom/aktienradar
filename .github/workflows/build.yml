name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk Aktienradar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aktienradar-APK
          path: Aktienradar.apk
      - name: Download-Seite (Release) aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          name: Aktienradar – aktuelle Version
          body: "Zum Installieren unten unter Assets auf **Aktienradar.apk** tippen. Keine Anlageberatung."
          files: Aktienradar.apk
          make_latest: true
